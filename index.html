<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>Cardinal MITRE v19 Slide Options</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="mitre-v19-options">
  <section class="client-instructions" aria-labelledby="review-instructions-title">
    <div class="instruction-heading">
      <span class="instruction-kicker">Client review</span>
      <strong id="review-instructions-title">Choose your preferred slide layout</strong>
    </div>
    <ol class="instruction-steps">
      <li>Navigate between the tabs.</li>
      <li>Play with the variations.</li>
      <li>Copy the preferred variation object.</li>
    </ol>
  </section>
  <section class="layout-variation-panel" aria-labelledby="layout-variation-title">
    <div class="control-group-heading">
      <strong id="layout-variation-title">Layout variation</strong>
      <span>Select one option tab</span>
    </div>
    <div class="option-tabs" id="v19-option-tabs" role="tablist" aria-label="Slide layout options"></div>
  </section>
  <div id="v19-slides"></div>
</div>
<script src="mitre-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="app.js"></script>
</body>
</html>
